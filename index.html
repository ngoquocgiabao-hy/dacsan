<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Đặc sản Hạ Long 下龙特产</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&display=swap">
<style id="css">
/* Layout: a bay-coloured signboard on top, then shelves of brush-character tiles; each tile opens its own product page. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#132A2D; --muted:#5A6D6C; --line:#D8DFD9;
  --sea:#0E5A63; --on-sea:#FFFFFF; --gold:#86621A; --seal:#A8281E; --wash:#E4ECE7;
  --bay1:#0A3239; --bay2:#11616B; --cream:#F6EEDC; --brass:#E3C377;
  --t1:#9C2A24; --t2:#0F5E67; --t3:#B07416; --t4:#24383C;
  --brush:"Ma Shan Zheng","Noto Serif SC","KaiTi","STKaiti",serif;
  --zh:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"Be Vietnam Pro","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1517; --surface:#122226; --ink:#E8EFEC; --muted:#93A8A6; --line:#25383B;
  --sea:#74C7CE; --on-sea:#062024; --gold:#D9B25C; --seal:#F08A7E; --wash:#16292D;
  --bay1:#061E23; --bay2:#0C454D; --cream:#F6EEDC; --brass:#E3C377;
  --t1:#8A2520; --t2:#0D525A; --t3:#996412; --t4:#1D2E32; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1517; --surface:#122226; --ink:#E8EFEC; --muted:#93A8A6; --line:#25383B;
  --sea:#74C7CE; --on-sea:#062024; --gold:#D9B25C; --seal:#F08A7E; --wash:#16292D;
  --bay1:#061E23; --bay2:#0C454D; --cream:#F6EEDC; --brass:#E3C377;
  --t1:#8A2520; --t2:#0D525A; --t3:#996412; --t4:#1D2E32; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--body);padding-inline:16px;padding-block:16px 56px}
#app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h1,h2,h3,p{margin:0}
.alt{display:block;color:var(--muted);font-size:.92em;margin-top:2px}

/* signboard */
.sign{position:relative;overflow:hidden;border-radius:14px;color:var(--cream);background:linear-gradient(165deg,var(--bay1),var(--bay2));padding:18px 18px 0}
.sign .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sign .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.sign h1{font:400 clamp(44px,13vw,68px)/1.05 var(--brush);margin-top:14px;text-wrap:balance}
.sign .sub{font-size:14px;opacity:.85;margin-top:4px}
.pledges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pledges span{border:1px solid rgba(227,195,119,.55);color:var(--brass);border-radius:999px;padding:2px 11px;font-size:12.5px}
.lang{display:flex;border:1px solid rgba(246,238,220,.4);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--cream);padding:5px 11px;font-size:12.5px}
.lang button[aria-pressed="true"]{background:var(--cream);color:#0A3239;font-weight:600}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shelves */
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.shelf-h h2{font:900 22px/1.2 var(--zh)}
.shelf-h i{font-style:normal;color:var(--gold);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.shelf p.intro{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:transparent;padding:0;min-width:0}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--cream)}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,transparent 46%,rgba(255,255,255,.07) 47% 49%,transparent 50%) 0 0/34px 22px,radial-gradient(circle at 0 120%,transparent 46%,rgba(255,255,255,.05) 47% 49%,transparent 50%) 17px 11px/34px 22px}
.tile::after{content:"";position:absolute;inset:7px;border:1px solid rgba(246,238,220,.38);border-radius:6px;pointer-events:none}
.tile b{position:relative;font:400 clamp(64px,22vw,104px)/1 var(--brush)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .stamp{position:absolute;right:13px;bottom:13px;font:400 13px/1.08 var(--brush);background:var(--cream);color:#9C2A24;padding:3px 2px;border-radius:2px;width:1.5em;text-align:center;word-break:break-all;z-index:1}
.tn1{background:var(--t1)}.tn2{background:var(--t2)}.tn3{background:var(--t3)}.tn4{background:var(--t4)}
.card .nm{font:600 17px/1.3 var(--zh)}
.card .vi{color:var(--muted);font-size:13px;line-height:1.35}
.card .pr{color:var(--seal);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.card .pr small{color:var(--muted);font-weight:400;font-size:12px}

/* product page */
.back{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px}
.pd{display:flex;flex-direction:column;gap:20px}
.pd>.tile{aspect-ratio:16/10;border-radius:14px}
.pd>.tile b{font-size:clamp(110px,34vw,190px)}
.pd>.tile .stamp{font-size:17px;right:18px;bottom:18px;padding:5px}
.pd .cat{color:var(--gold);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.pd h1{font:900 clamp(30px,8.5vw,42px)/1.15 var(--zh);text-wrap:balance}
.pd .vn{color:var(--muted);font-size:16px}
.pd .tag{font:400 24px/1.3 var(--brush);color:var(--sea);margin-top:6px}
.pd .tag .alt{font:400 14px/1.4 var(--body)}
.pricebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-block:1px solid var(--line);padding-block:12px;font-variant-numeric:tabular-nums}
.pricebox b{color:var(--seal);font-size:26px;font-weight:600;line-height:1.1}
.pricebox span{color:var(--muted);font-size:14px}
.pricebox em{margin-left:auto;font-style:normal;font-size:12px;color:var(--gold);border:1px solid currentColor;border-radius:3px;padding:1px 7px}
.story{font-size:16px;max-width:62ch}
.facts{display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:14px 16px;margin:0}
.facts dt{color:var(--gold);font-weight:600;font-size:13px;letter-spacing:.04em;padding-top:2px}
.facts dd{margin:0;min-width:0}
.facts ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.carry{background:var(--wash);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.carry h3{font:600 15px/1.3 var(--zh);color:var(--sea)}
.staff{border:1px dashed var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.staff h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.staff .say{font:600 19px/1.5 var(--zh)}
.staff .py{color:var(--sea);font-size:14px}
.staff .mean{color:var(--muted);font-size:14px}
.more h3{font:900 18px/1.2 var(--zh);margin-bottom:12px}
.share{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.qr{background:#fff;padding:6px;border-radius:6px;line-height:0;width:112px;flex:none}
.qr svg{width:100%;height:auto;display:block}
.small{font-size:12.5px;color:var(--muted)}

.foot{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.foot dt{color:var(--muted)} .foot dd{margin:0;user-select:all;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:transparent;border-radius:4px;padding:1px 8px;font-size:12px;margin-left:8px}
.linkish{border:0;background:transparent;padding:0;color:var(--sea);text-decoration:underline;font-size:13px;align-self:flex-start}

/* shelf labels */
.note{background:var(--wash);border-left:3px solid var(--gold);padding:10px 12px;font-size:14px;border-radius:0 6px 6px 0}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.label{background:#fff;color:#132A2D;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-align:center;box-shadow:0 1px 0 1px rgba(19,42,45,.14)}
.label .top{color:#F6EEDC;padding:10px 8px 8px;display:flex;flex-direction:column;gap:2px}
.label .top b{font:400 26px/1.15 var(--brush)}
.label .top i{font-style:normal;font-size:11.5px;opacity:.9}
.label .mid{padding:10px 14px 4px}
.label .qr{width:100%;padding:0}
.label em{font-style:normal;font-weight:600;color:#A8281E;font-size:13.5px;font-variant-numeric:tabular-nums}
.label small{font-size:11px;letter-spacing:.06em;padding:4px 6px 10px;color:#5A6D6C}

/* editor */
.ed{display:flex;flex-direction:column;gap:12px}
.ed fieldset,.ed details{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;margin:0}
.ed legend,.ed summary{font-weight:600}
.ed summary{cursor:pointer}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.ed label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.ed input,.ed select,.ed textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;font-size:14px;width:100%;color:var(--ink)}
.ed textarea{min-height:66px;resize:vertical}
.wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:500}
.btn.main{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.btn.danger{color:var(--seal)}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#msg{font-size:13px;color:var(--muted)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:4px}

/* ---- motion ---- */
.scene{position:relative;height:112px;margin:12px -18px 0;overflow:hidden}
.scene .hills{position:absolute;inset:0;width:100%;height:100%}
.sun{position:absolute;right:17%;bottom:58px;width:26px;height:26px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 0 rgba(227,195,119,.35);animation:glow 4.5s ease-in-out infinite}
.birds{position:absolute;top:4px;left:-60px;width:56px;fill:none;stroke:var(--cream);stroke-width:1.4;stroke-linecap:round;opacity:.7;animation:glide 28s linear infinite}
.boat{position:absolute;bottom:12px;left:56%;width:34px;animation:drift 16s ease-in-out infinite alternate}
.boat g{transform-origin:50% 100%;transform-box:fill-box;animation:bob 3.2s ease-in-out infinite alternate}
.waves{position:absolute;left:0;bottom:0;width:200%;height:20px;animation:tide 14s linear infinite}
.waves.w2{bottom:5px;opacity:.5;animation-duration:22s;animation-direction:reverse}
.scene::after{content:"";position:absolute;inset:30% -50% 22% -50%;background:linear-gradient(90deg,transparent,rgba(246,238,220,.13) 30%,transparent 55%,rgba(246,238,220,.09) 80%,transparent);animation:mist 20s ease-in-out infinite alternate;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 45%,#000 55%,transparent);mask-image:linear-gradient(transparent,#000 45%,#000 55%,transparent)}
@keyframes glow{50%{box-shadow:0 0 0 14px rgba(227,195,119,0)}}
@keyframes glide{to{transform:translateX(calc(100vw + 120px)) translateY(-6px)}}
@keyframes drift{from{transform:translateX(-34px)}to{transform:translateX(30px)}}
@keyframes bob{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg) translateY(1px)}}
@keyframes tide{to{transform:translateX(-50%)}}
@keyframes mist{from{transform:translateX(-12%)}to{transform:translateX(12%)}}

.ticker{overflow:hidden;border-block:1px solid var(--line);padding-block:8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker div{display:flex;gap:26px;width:max-content;animation:tide 38s linear infinite;font:400 21px/1.2 var(--brush);color:var(--sea);white-space:nowrap}
.ticker span::after{content:"✦";margin-left:26px;color:var(--gold);font-size:11px;vertical-align:middle}

.sheen{position:absolute;inset:-20% auto -20% 0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);transform:translateX(-140%) skewX(-14deg);pointer-events:none;z-index:1}
.card:hover .sheen,.card:focus-visible .sheen{transition:transform .8s cubic-bezier(.2,.7,.2,1);transform:translateX(340%) skewX(-14deg)}
.card .tile{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover .tile{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 14px 22px -14px rgba(10,50,57,.55)}
.card:hover .tile b{transform:scale(1.07)}
.card .tile b{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:active .tile{transform:scale(.96);transition-duration:.1s}
.btn,.back,.tabs button,.lang button{transition:transform .15s,background-color .2s,color .2s}
.btn:active,.back:active,.tabs button:active{transform:scale(.95)}

@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);filter:blur(5px)}to{clip-path:inset(0 0 0 0);filter:blur(0)}}
@keyframes sunrise{from{transform:translateY(60px);opacity:0}}
@keyframes ink{from{opacity:0;filter:blur(16px);transform:scale(1.35)}}
@keyframes thump{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}60%{opacity:1;transform:scale(.9) rotate(2deg)}100%{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes sweep{to{transform:translateX(340%) skewX(-14deg)}}
.anim .sign h1{animation:wipe 1.1s cubic-bezier(.3,.7,.2,1) both .15s}
.anim .sign .sub{animation:rise .6s both .7s}
.anim .pledges span{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.9s + var(--i)*110ms)}
.anim .sun{animation:sunrise 1.8s cubic-bezier(.2,.7,.2,1) both,glow 4.5s ease-in-out 1.8s infinite}
.anim .st{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms + .1s)}
.anim .st .sheen{animation:sweep .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms + .55s)}
.anim .pd>.tile b{animation:ink 1s cubic-bezier(.2,.7,.2,1) both .1s}
.anim .pd>.tile .stamp{animation:thump .55s cubic-bezier(.3,1.3,.5,1) both .85s}
.anim .pd>.tile .sheen{animation:sweep 1.2s cubic-bezier(.2,.7,.2,1) both .5s}
.anim .label{animation:rise .5s both;animation-delay:calc(var(--i)*45ms)}
.pd>.tile::before{animation:swell 9s linear infinite}
@keyframes swell{to{background-position:34px 0,51px 11px}}
.pd>.tile{view-transition-name:ptile}
::view-transition-group(ptile){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root){animation:vt-out .22s both}
::view-transition-new(root){animation:vt-in .4s both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
@supports (animation-timeline:view()){
  .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E9E6B;animation:pulse 2s ease-out infinite}
.stock.low::before{background:#D08A1A}.stock.out::before{background:#9AA5A4;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,158,107,.55)}100%{box-shadow:0 0 0 9px rgba(46,158,107,0)}}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-size:11px;font-weight:600;background:var(--cream);color:#132A2D;border-radius:999px;padding:1px 8px}
.card.sold .tile{filter:grayscale(.75) brightness(.85)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

muckho","cat":"hai","ch":"鱿","tone":2,"zh":"鱿鱼干","vi":"Mực khô","price":900000,"uzh":"公斤","uvi":"kg","tagzh":"北部湾日晒，越嚼越甜","tagvi":"Phơi nắng vịnh Bắc Bộ, càng nhai càng ngọt","dzh":"北部湾的鱿鱼剖开后在太阳下自然晒干，肉厚味甜。越南人喜欢烤香了撕成丝，配啤酒。","dvi":"Mực vịnh Bắc Bộ mổ ra phơi nắng tự nhiên, mình dày, thịt ngọt. Người Việt thích nướng thơm, xé sợi, nhắm bia.","ozh":"广宁沿海渔港","ovi":"Các cảng cá ven biển Quảng Ninh","kzh":"肉厚，咸鲜回甜，烤后很香","kvi":"Mình dày, mặn ngọt, nướng lên rất thơm","ezh":"小火烤香，撕成丝，蘸辣椒酱配啤酒\n泡发后和芹菜、青椒同炒\n和排骨一起煲汤提鲜","evi":"Nướng nhỏ lửa, xé sợi, chấm tương ớt, nhắm bia\nNgâm nở rồi xào cần tây, ớt chuông\nNinh cùng sườn cho ngọt nước","czh":"颜色淡粉透亮，表面有一层薄薄的白霜；身子干爽不粘手；闻起来是海味，不刺鼻。","cvi":"Màu hồng nhạt, trong; mặt phủ lớp phấn trắng mỏng; thân khô, không dính tay; mùi biển tự nhiên, không hắc.","szh":"密封后放冰箱冷冻，能放得更久。","svi":"Bọc kín để ngăn đá thì giữ được lâu hơn.","bzh":"干制水产品不在中国海关的禁带名录内。自用、合理数量，入境时配合检疫即可。","bvi":"Thủy sản khô không nằm trong danh mục cấm mang vào Trung Quốc. Mang số lượng dùng cá nhân và hợp tác kiểm dịch khi nhập cảnh.","say":"这个鱿鱼干是晒的，肉很厚，烤一下配啤酒最好。","py":"Zhège yóuyú gān shì shài de, ròu hěn hòu, kǎo yíxià pèi píjiǔ zuì hǎo.","sayvi":"Mực này phơi nắng, mình dày, nướng lên nhắm bia là ngon nhất.","img":""},{"id":"sasung","stock":"low","cat":"hai","ch":"沙","tone":3,"zh":"沙虫干","vi":"Sá sùng khô","price":3500000,"uzh":"公斤","uvi":"kg","tagzh":"五公斤鲜货，晒一公斤干","tagvi":"5 kg tươi mới được 1 kg khô","dzh":"沙虫生活在沙滩下面，退潮时靠人一锄一锄挖出来，再剖开洗净晒干。五公斤鲜沙虫只能出一公斤干货，所以贵。广西客人对它不陌生，北海也产。","dvi":"Sá sùng sống dưới bãi cát, nước rút người ta đào từng con bằng mai, mổ, rửa sạch rồi phơi. 5 kg tươi chỉ được 1 kg khô nên giá cao. Khách Quảng Tây rất quen món này vì Bắc Hải cũng có.","ozh":"广宁省云屯：关兰岛、明珠岛的沙滩，每年 3–7 月开采","ovi":"Bãi cát Quan Lạn, Minh Châu (Vân Đồn); khai thác tháng 3–7","kzh":"熬出的汤清甜，本身有嚼劲","kvi":"Nước ninh ngọt thanh, thân dai","ezh":"干锅炒到微黄，再熬汤或煮粥\n熬河粉汤底，越南老店的做法\n炒香后直接当下酒菜","evi":"Rang khô đến hơi vàng rồi ninh nước hoặc nấu cháo\nNinh nước phở, cách làm của các hàng phở lâu năm\nRang giòn nhắm rượu","czh":"选象牙白或带淡粉色的，不要死白；身厚，长 6–15 厘米；只有淡淡的海味。","cvi":"Chọn con trắng ngà hoặc ánh hồng nhạt, tránh trắng bệch; thân dày, dài 6–15 cm; chỉ có mùi biển nhẹ.","szh":"真空或密封罐，冰箱冷藏可存 6–12 个月。用前剪开，洗净沙粒。","svi":"Hút chân không hoặc hũ kín, ngăn mát giữ 6–12 tháng. Trước khi nấu cắt đôi, rửa sạch cát.","bzh":"干制水产品不在中国海关的禁带名录内。自用、合理数量，入境时配合检疫即可。","bvi":"Thủy sản khô không nằm trong danh mục cấm mang vào Trung Quốc. Mang số lượng dùng cá nhân và hợp tác kiểm dịch khi nhập cảnh.","say":"沙虫干熬汤特别鲜，五公斤鲜的才晒一公斤。","py":"Shāchóng gān áo tāng tèbié xiān, wǔ gōngjīn xiān de cái shài yì gōngjīn.","sayvi":"Sá sùng khô ninh nước rất ngọt, 5 cân tươi mới phơi được 1 cân.","img":""},{"id":"tomkho","cat":"hai","ch":"虾","tone":4,"zh":"虾干","vi":"Tôm khô","price":800000,"uzh":"公斤","uvi":"kg","tagzh":"煮熟日晒，开袋能吃","tagvi":"Luộc chín phơi nắng, mở túi là ăn được","dzh":"海虾先煮熟再晒干，肉质紧实，咸里带甜。煮汤、煮粥放一把就很鲜，也能直接当零食。","dvi":"Tôm biển luộc chín rồi phơi khô, thịt chắc, mặn mà ngọt. Nấu canh, nấu cháo cho một nắm là ngọt nước, ăn vặt cũng được.","ozh":"广宁沿海","ovi":"Ven biển Quảng Ninh","kzh":"肉紧，咸甜，越嚼越香","kvi":"Thịt chắc, mặn ngọt, càng nhai càng thơm","ezh":"煮冬瓜汤、丝瓜汤\n和大米一起煮粥\n直接当零食或下酒","evi":"Nấu canh bí, canh mướp\nNấu cháo\nĂn vặt hoặc nhắm bia","czh":"颜色是自然的橙红，不要红得发亮的；虾身完整、干爽、不粘手。","cvi":"Màu đỏ cam tự nhiên, tránh loại đỏ rực bóng; con nguyên vẹn, khô ráo, không dính tay.","szh":"密封，冷藏或冷冻。","svi":"Đậy kín, để ngăn mát hoặc ngăn đá.","bzh":"干制水产品不在中国海关的禁带名录内。自用、合理数量，入境时配合检疫即可。","bvi":"Thủy sản khô không nằm trong danh mục cấm mang vào Trung Quốc. Mang số lượng dùng cá nhân và hợp tác kiểm dịch khi nhập cảnh.","say":"虾干是煮熟晒的，煮汤、煮粥都很鲜。","py":"Xiā gān shì zhǔ shú shài de, zhǔ tāng, zhǔ zhōu dōu hěn xiān.","sayvi":"Tôm khô luộc chín rồi phơi, nấu canh nấu cháo đều ngọt.","img":""},{"id":"ruoumo","cat":"qn","ch":"梅","tone":1,"zh":"安子山青梅酒","vi":"Rượu mơ Yên Tử","price":210000,"uzh":"瓶 500ml","uvi":"chai 500ml","tagzh":"佛教名山的青梅，琥珀色","tagvi":"Mơ núi thiêng Yên Tử, màu hổ phách","dzh":"安子山是越南的佛教名山。每年三四月青梅成熟，当地人摘下来浸泡成酒。酒色琥珀，酸甜顺口，是广宁省的 OCOP 产品。","dvi":"Yên Tử là núi thiêng Phật giáo của Việt Nam. Tháng 3, tháng 4 mơ chín, người dân hái về ngâm thành rượu. Rượu màu hổ phách, chua ngọt dễ uống, là sản phẩm OCOP của Quảng Ninh.","ozh":"广宁省汪秘市安子山","ovi":"Yên Tử, Uông Bí, Quảng Ninh","kzh":"酸甜，梅子香","kvi":"Chua ngọt, thơm mùi mơ","ezh":"冰镇后直接喝\n加冰块，或兑苏打水\n配海鲜、烧烤","evi":"Uống lạnh\nThêm đá hoặc pha soda\nHợp với hải sản, đồ nướng","czh":"认准瓶身上的 OCOP 标志和生产日期；酒液清亮，颜色是琥珀色。","cvi":"Tìm logo OCOP và ngày sản xuất trên chai; rượu trong, màu hổ phách.","szh":"避光常温存放，开瓶后冷藏。","svi":"Để nơi mát, tránh nắng; mở rồi để tủ lạnh.","bzh":"12 度以上的酒，带满 1500 毫升要向中国海关申报。带两瓶以内最省事。未成年人请勿饮酒。","bvi":"Rượu từ 12 độ trở lên, mang từ 1.500 ml phải khai báo hải quan Trung Quốc. Mang hai chai trở xuống là gọn nhất.","say":"这是安子山的青梅酒，酸酸甜甜，冰一下更好喝。","py":"Zhè shì Ānzǐ Shān de qīngméi jiǔ, suānsuān tiántián, bīng yíxià gèng hǎohē.","sayvi":"Đây là rượu mơ Yên Tử, chua chua ngọt ngọt, ướp lạnh uống ngon hơn.","img":""},{"id":"trahoavang","cat":"qn","ch":"茶","tone":2,"zh":"巴扯金花茶","vi":"Trà hoa vàng Ba Chẽ","price":0,"uzh":"","uvi":"","tagzh":"山里的金色茶花","tagvi":"Bông trà vàng của núi rừng","dzh":"金花茶是山茶科植物，开金黄色的花，直径五六厘米。巴扯县种了近三百公顷，是广宁省 OCOP 五星产品。广西防城也产金花茶，所以中国客人一看就认识。","dvi":"Trà hoa vàng thuộc họ chè, hoa vàng rực, đường kính 5–6 cm. Ba Chẽ trồng gần 300 ha, là sản phẩm OCOP 5 sao của Quảng Ninh. Phòng Thành (Quảng Tây) cũng có kim hoa trà nên khách Trung nhìn là nhận ra.","ozh":"广宁省巴扯县，三四月采的花最好","ovi":"Ba Chẽ, Quảng Ninh; hoa hái tháng 3–4 là đẹp nhất","kzh":"汤色像蜂蜜，清淡，回甘久","kvi":"Nước vàng như mật ong, vị thanh, ngọt hậu lâu","ezh":"取一小撮干花，先用热水冲洗一遍\n沸水冲泡，可以续水几次\n也有干叶、茶包可选","evi":"Lấy một nhúm hoa khô, tráng qua nước nóng\nHãm nước sôi, châm thêm được vài lần\nCó cả lá khô, trà túi lọc","czh":"花朵完整，颜色金黄自然，干爽不碎。整朵干花比碎花贵。","cvi":"Bông nguyên, vàng tự nhiên, khô, không vụn. Hoa nguyên bông đắt hơn hoa vụn.","szh":"密封、避光、防潮。","svi":"Đậy kín, tránh nắng, tránh ẩm.","bzh":"自用、合理数量即可，具体以中国海关现场规定为准。","bvi":"Mang số lượng dùng cá nhân; quy định cụ thể theo hải quan Trung Quốc tại cửa khẩu.","say":"这是巴扯的金花茶，跟广西防城的金花茶是一类，泡出来是金黄色。","py":"Zhè shì Bāchě de jīnhuā chá, gēn Guǎngxī Fángchéng de jīnhuā chá shì yí lèi, pào chūlái shì jīnhuáng sè.","sayvi":"Đây là trà hoa vàng Ba Chẽ, cùng loại với kim hoa trà Phòng Thành, Quảng Tây, pha ra nước màu vàng óng.","img":""},{"id":"ngoctrai","cat":"qn","ch":"珠","tone":4,"zh":"下龙湾珍珠","vi":"Ngọc trai Hạ Long","price":0,"uzh":"","uvi":"","tagzh":"在海湾里养两年的珍珠","tagvi":"Viên ngọc nuôi hai năm trong vịnh","dzh":"下龙湾里有珍珠养殖场，面积五十多公顷。母贝植核以后，要在海里养大约 24 个月才长成一颗珍珠。2020 年，下龙珍珠被评为越南国家级 OCOP 五星产品。","dvi":"Vịnh Hạ Long có trại nuôi trai hơn 50 ha. Sau khi cấy nhân, trai phải nuôi khoảng 24 tháng mới thành viên ngọc. Năm 2020 ngọc trai Hạ Long được công nhận OCOP 5 sao cấp quốc gia.","ozh":"下龙湾 Tùng Sâu、Vông Viêng 海域","ovi":"Vụng Tùng Sâu, Vông Viêng, vịnh Hạ Long","kzh":"Akoya 珍珠 3–9 毫米；有金色、粉色、银灰色","kvi":"Ngọc Akoya 3–9 mm; màu vàng, hồng, xám bạc","ezh":"项链、耳饰、戒指，日常都能戴\n送长辈、送太太的体面礼物","evi":"Vòng cổ, hoa tai, nhẫn đeo hằng ngày\nQuà biếu mẹ, tặng vợ","czh":"两颗轻轻互相摩擦，真珍珠有细沙感，仿珠很滑；光泽要清晰、有层次；每颗大小略有不同才自然。","cvi":"Cọ nhẹ hai viên vào nhau: ngọc thật hơi sàn sạn, ngọc giả trơn; ánh ngọc sâu, rõ; các viên hơi khác nhau mới tự nhiên.","szh":"戴完用软布擦干，单独存放；避开香水、汗水、化妆品。","svi":"Đeo xong lau bằng vải mềm, cất riêng; tránh nước hoa, mồ hôi, mỹ phẩm.","bzh":"请保留购物凭证，过关时备查。","bvi":"Giữ hóa đơn để xuất trình khi cần.","say":"这是下龙湾养的海水珍珠，养了两年，您可以戴上试试。","py":"Zhè shì Xiàlóng Wān yǎng de hǎishuǐ zhēnzhū, yǎng le liǎng nián, nín kěyǐ dài shàng shìshi.","sayvi":"Đây là ngọc trai nước mặn nuôi ở vịnh Hạ Long, nuôi hai năm, anh chị đeo thử xem.","img":""},{"id":"caphe","cat":"vn","ch":"啡","tone":1,"zh":"越南滴漏咖啡","vi":"Cà phê phin","price":0,"uzh":"","uvi":"","tagzh":"一滴一滴，配炼乳","tagvi":"Nhỏ từng giọt, thêm sữa đặc","dzh":"越南是世界第二大咖啡出口国，以罗布斯塔豆为主，味道浓，苦味明显，带可可香。当地人用小铝壶慢慢滴滤，再兑炼乳加冰。","dvi":"Việt Nam xuất khẩu cà phê lớn thứ hai thế giới, chủ yếu là Robusta: đậm, đắng rõ, thơm ca cao. Người Việt pha bằng phin nhôm cho nhỏ giọt rồi thêm sữa đặc và đá.","ozh":"越南西原高地：多乐省、林同省","ovi":"Tây Nguyên: Đắk Lắk, Lâm Đồng","kzh":"浓、苦、香，咖啡因高","kvi":"Đậm, đắng, thơm; nhiều caffeine","ezh":"滴漏壶放两勺咖啡粉，轻轻压实，冲热水，等四五分钟\n杯底先放炼乳，就是越式奶咖\n加冰块更地道","evi":"Cho hai thìa bột vào phin, nén nhẹ, rót nước sôi, chờ 4–5 phút\nCho sữa đặc vào cốc trước là thành cà phê sữa\nThêm đá cho đúng vị","czh":"看烘焙日期，越近越好。想方便选三合一速溶，想地道就买咖啡粉加一个滴漏壶。","cvi":"Xem ngày rang, càng mới càng tốt. Muốn tiện chọn 3 trong 1, muốn đúng vị mua bột kèm một chiếc phin.","szh":"开封后密封，一个月内喝完。","svi":"Mở rồi đậy kín, dùng trong một tháng.","bzh":"自用、合理数量即可，具体以中国海关现场规定为准。","bvi":"Mang số lượng dùng cá nhân; quy định cụ thể theo hải quan Trung Quốc tại cửa khẩu.","say":"越南咖啡很浓，加炼乳最好喝，买咖啡粉可以带一个滴漏壶。","py":"Yuènán kāfēi hěn nóng, jiā liànrǔ zuì hǎohē, mǎi kāfēi fěn kěyǐ dài yí ge dīlòu hú.","sayvi":"Cà phê Việt Nam rất đậm, thêm sữa đặc là ngon nhất, mua bột nên lấy kèm một chiếc phin.","img":""},{"id":"hatdieu","cat":"vn","ch":"果","tone":3,"zh":"带皮盐焗腰果","vi":"Hạt điều rang muối","price":0,"uzh":"","uvi":"","tagzh":"带皮烤，奶香更足","tagvi":"Rang nguyên vỏ lụa, béo thơm","dzh":"越南是全球最大的腰果仁出口国，平福省被叫作腰果之乡。带着褐色薄皮一起烤，香味锁在里面，吃的时候轻轻一搓皮就掉。","dvi":"Việt Nam xuất khẩu nhân điều nhiều nhất thế giới, Bình Phước được gọi là thủ phủ điều. Rang nguyên vỏ lụa nên giữ được mùi thơm, khi ăn xoa nhẹ là vỏ bong.","ozh":"越南平福省","ovi":"Bình Phước","kzh":"脆，奶香，微咸","kvi":"Giòn, béo, mặn nhẹ","ezh":"直接吃，配茶配啤酒都行\n切碎撒在沙拉、炒菜上","evi":"Ăn ngay, hợp cả trà lẫn bia\nGiã dập rắc lên gỏi, món xào","czh":"颗粒大而完整，碎粒少；闻着没有油哈味；罐装比袋装更防潮。","cvi":"Hạt to, nguyên, ít vụn; không có mùi dầu hôi; hộp kín chống ẩm tốt hơn túi.","szh":"开封后密封，两周内吃完口感最好。","svi":"Mở rồi đậy kín, ăn trong hai tuần là giòn nhất.","bzh":"自用、合理数量即可，具体以中国海关现场规定为准。","bvi":"Mang số lượng dùng cá nhân; quy định cụ thể theo hải quan Trung Quốc tại cửa khẩu.","say":"这是带皮烤的腰果，很香，您尝一颗。","py":"Zhè shì dài pí kǎo de yāoguǒ, hěn xiāng, nín cháng yì kē.","sayvi":"Đây là hạt điều rang nguyên vỏ lụa, rất thơm, mời anh chị nếm một hạt.","img":""},{"id":"banhdauxanh","cat":"vn","ch":"豆","tone":2,"zh":"绿豆糕","vi":"Bánh đậu xanh","price":0,"uzh":"","uvi":"","tagzh":"入口即化，配热茶","tagvi":"Tan trong miệng, hợp trà nóng","dzh":"越南北方的传统茶点，最有名的产地是海阳。绿豆去皮磨成细粉，加糖和油压成小方块。一盒里面分成很多小包，适合分给同事朋友。","dvi":"Món trà bánh truyền thống miền Bắc, nổi tiếng nhất là Hải Dương. Đậu xanh bỏ vỏ xay mịn, thêm đường và dầu rồi ép thành khối nhỏ. Mỗi hộp chia nhiều gói con, tiện chia cho đồng nghiệp.","ozh":"越南海阳省","ovi":"Hải Dương","kzh":"细腻，甜，豆香","kvi":"Mịn, ngọt, thơm đậu","ezh":"配热的绿茶或莲花茶，一口茶一口糕","evi":"Ăn với trà xanh nóng hoặc trà sen, một ngụm trà một miếng bánh","czh":"看生产日期；包装完整不受潮。绿豆糕偏甜，怕甜可以选少糖款。","cvi":"Xem ngày sản xuất; hộp nguyên, không ẩm. Bánh khá ngọt, ngại ngọt thì chọn loại ít đường.","szh":"放阴凉干燥处，开封后尽快吃完。","svi":"Để nơi khô mát, mở rồi ăn sớm.","bzh":"自用、合理数量即可，具体以中国海关现场规定为准。","bvi":"Mang số lượng dùng cá nhân; quy định cụ thể theo hải quan Trung Quốc tại cửa khẩu.","say":"绿豆糕入口就化，配热茶吃。一盒有很多小包，送人方便。","py":"Lǜdòu gāo rùkǒu jiù huà, pèi rè chá chī. Yì hé yǒu hěn duō xiǎo bāo, sòng rén fāngbiàn.","sayvi":"Bánh đậu xanh tan trong miệng, ăn với trà nóng. Một hộp có nhiều gói nhỏ, tiện làm quà.","img":""},{"id":"banhpia","cat":"vn","ch":"榴","tone":1,"zh":"榴莲饼","vi":"Bánh pía sầu riêng","price":0,"uzh":"","uvi":"","tagzh":"一层层酥皮，榴莲绿豆馅","tagvi":"Vỏ ngàn lớp, nhân sầu riêng đậu xanh","dzh":"榴莲饼出自越南南部的朔庄省，最早是潮州移民带来的做法，pía 就是潮州话的“饼”。酥皮一层一层，里面是绿豆沙和榴莲，有的还包咸蛋黄。","dvi":"Bánh pía gốc ở Sóc Trăng, do người Triều Châu mang sang; “pía” chính là chữ “bánh” trong tiếng Triều Châu. Vỏ nhiều lớp mỏng, nhân đậu xanh và sầu riêng, có loại thêm trứng muối.","ozh":"越南朔庄省","ovi":"Sóc Trăng","kzh":"酥，软，榴莲味浓","kvi":"Vỏ tơi, nhân mềm, đậm mùi sầu riêng","ezh":"切成小块配热茶\n冷藏后口感更紧实","evi":"Cắt miếng nhỏ ăn với trà nóng\nĐể lạnh ăn chắc bánh hơn","czh":"看生产日期，越新鲜越好。有带蛋黄和不带蛋黄两种。","cvi":"Xem ngày sản xuất, càng mới càng ngon. Có hai loại: có trứng muối và không trứng.","szh":"常温保质期不长，请留意日期；开封后冷藏。","svi":"Hạn dùng ở nhiệt độ thường không dài, nhớ xem ngày; mở rồi để tủ lạnh.","bzh":"含咸蛋黄的糕点过中国海关时可能被拦下，带回国建议选不带蛋黄的款式。","bvi":"Bánh có trứng muối có thể bị hải quan Trung Quốc giữ lại; khách mang về nên chọn loại không trứng.","say":"这个榴莲饼有带蛋黄和不带蛋黄两种，带回国建议选不带蛋黄的。","py":"Zhège liúlián bǐng yǒu dài dànhuáng hé bú dài dànhuáng liǎng zhǒng, dài huí guó jiànyì xuǎn bú dài dànhuáng de.","sayvi":"Bánh pía có loại có trứng muối và loại không, mang về nước anh chị nên chọn loại không trứng.","img":""},{"id":"mitsay","cat":"vn","ch":"蜜","tone":3,"zh":"菠萝蜜干","vi":"Mít sấy","price":0,"uzh":"","uvi":"","tagzh":"香脆，甜味来自水果本身","tagvi":"Giòn tan, ngọt từ quả","dzh":"菠萝蜜是越南常见的热带水果。果肉切片后低温脱水，保留了颜色和香味，口感酥脆，不喜欢太甜的人也能接受。","dvi":"Mít là trái cây nhiệt đới quen thuộc ở Việt Nam. Múi mít thái lát, sấy ở nhiệt độ thấp nên giữ được màu và mùi, giòn tan, người ngại ngọt cũng ăn được.","ozh":"越南南部","ovi":"Miền Nam Việt Nam","kzh":"脆，果香，微甜","kvi":"Giòn, thơm mít, ngọt nhẹ","ezh":"开袋即食\n配酸奶、麦片当早餐","evi":"Mở túi ăn ngay\nĂn với sữa chua, ngũ cốc buổi sáng","czh":"看配料表，越简单越好；颜色是自然的金黄。","cvi":"Xem bảng thành phần, càng ít thứ càng tốt; màu vàng tự nhiên.","szh":"怕潮。开袋后夹紧袋口，尽快吃完。","svi":"Dễ ỉu. Mở rồi kẹp kín miệng túi, ăn sớm.","bzh":"自用、合理数量即可，具体以中国海关现场规定为准。","bvi":"Mang số lượng dùng cá nhân; quy định cụ thể theo hải quan Trung Quốc tại cửa khẩu.","say":"这是菠萝蜜干，很脆，不太甜，您尝一片。","py":"Zhè shì bōluómì gān, hěn cuì, bú tài tián, nín cháng yí piàn.","sayvi":"Đây là mít sấy, rất giòn, không ngọt gắt, mời anh chị nếm một miếng.","img":""}]}</script>

  var id='f-'+path.replace(/\./g,'-');
  var inp=type==='area'?'<textarea id="'+id+'" data-p="'+path+'">'+esc(val)+'</textarea>'
    :'<input id="'+id+'" data-p="'+path+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(type==='number'?' min="0" inputmode="numeric"':'')+'>';
  return '<label'+(cls?' class="'+cls+'"':'')+'>'+label+inp+'</label>';
}
var PAIRS=[['tag','Câu giới thiệu ngắn',''],['d','Câu chuyện sản phẩm','area'],['o','Xuất xứ',''],['k','Đặc điểm',''],['e','Cách dùng (mỗi dòng một ý)','area'],['c','Cách chọn','area'],['s','Bảo quản','area'],['b','Mang về nước','area']];
function viewEdit(){
  var s=draft,h='<div class="ed"><fieldset><legend>Cửa hàng</legend><div class="fg">'
    +fld('Tên tiếng Trung','shop.zh',s.shop.zh)+fld('Tên tiếng Việt','shop.vi',s.shop.vi)+fld('Địa chỉ','shop.addr',s.shop.addr)
    +fld('WeChat ID','shop.wechat',s.shop.wechat)+fld('Điện thoại','shop.phone',s.shop.phone)
    +fld('Tỷ giá tham khảo (đồng / 1 tệ)','rate',s.rate,'number')
    +fld('Link trang (mã QR dẫn về đây)','base',s.base,'url','wide')+'</div></fieldset>';
  s.items.forEach(function(it,i){
    var p='items.'+i+'.';
    h+='<details'+(ui.edOpen===it.id?' open':'')+' data-ed="'+esc(it.id)+'"><summary>'+esc(it.zh||'(chưa đặt tên)')+' · '+esc(it.vi)+'</summary><div class="fg">'
      +fld('Tên tiếng Trung',p+'zh',it.zh)+fld('Tên tiếng Việt',p+'vi',it.vi)+fld('Chữ trên ô (1 chữ Hán)',p+'ch',it.ch)
      +'<label>Màu ô<select id="f-items-'+i+'-tone" data-p="'+p+'tone">'+[[1,'Đỏ son'],[2,'Xanh vịnh'],[3,'Vàng nắng'],[4,'Mực']].map(function(x){return '<option value="'+x[0]+'"'+(+it.tone===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'
      +'<label>Tình trạng hàng<select id="f-items-'+i+'-stock" data-p="'+p+'stock">'+[['in','Còn hàng'],['low','Sắp hết'],['out','Tạm hết hàng']].map(function(x){return '<option value="'+x[0]+'"'+((it.stock||'in')===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'
      +'<label>Kệ hàng<select id="f-items-'+i+'-cat" data-p="'+p+'cat">'+s.cats.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===it.cat?' selected':'')+'>'+esc(c.vi)+'</option>'}).join('')+'</select></label>'
      +fld('Giá (đồng, 0 = giá tại quầy)',p+'price',it.price,'number')
      +fld('Đơn vị (Trung)',p+'uzh',it.uzh)+fld('Đơn vị (Việt)',p+'uvi',it.uvi);
    PAIRS.forEach(function(x){h+=fld(x[1]+' · Trung',p+x[0]+'zh',it[x[0]+'zh'],x[2],x[2]?'wide':'')+fld(x[1]+' · Việt',p+x[0]+'vi',it[x[0]+'vi'],x[2],x[2]?'wide':'')});
    h+=fld('Câu chào hàng (chữ Hán)',p+'say',it.say,'area','wide')+fld('Pinyin',p+'py',it.py,'area','wide')+fld('Nghĩa tiếng Việt',p+'sayvi',it.sayvi,'area','wide')
      +'<div class="wide row">'+(it.img?'<img class="thumb" src="'+esc(it.img)+'" alt="">':'')
      +'<label style="flex:1;min-width:180px">Ảnh sản phẩm (thay cho ô chữ)<input id="f-items-'+i+'-img" type="file" accept="image/*" data-img="'+i+'"></label>'
      +(it.img?'<button class="btn" data-noimg="'+i+'">Bỏ ảnh</button>':'')
      +'<button class="btn" data-up="'+i+'"'+(i?'':' disabled')+'>Lên trên</button>'
      +'<button class="btn danger" data-del="'+i+'">Xóa sản phẩm</button></div></div></details>';
  });
  h+='<div class="row"><button class="btn" data-add="1">Thêm sản phẩm</button></div>'
    +'<div class="savebar"><button class="btn main" data-save="1">Lưu cho mọi người</button><button class="btn" data-cancel="1">Bỏ thay đổi</button><span id="msg">'+esc(ui.msg)+'</span></div></div>';
  return h;
}
function tabsHtml(){
  return '<nav class="tabs">'+[['home','Khách xem'],['labels','Tem QR kệ hàng'],['edit','Chỉnh sửa']].map(function(x){return '<button data-view="'+x[0]+'" aria-pressed="'+(ui.view===x[0]||(x[0]==='home'&&ui.view==='product'))+'">'+x[1]+'</button>'}).join('')+'</nav>';
}
var still=false;try{still=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function countUp(){
  var el=app.querySelector('[data-count]');if(!el||still||!window.requestAnimationFrame)return;
  var to=+el.dataset.count,t0=0,dur=900;
  requestAnimationFrame(function step(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=vnd(to*e);if(k<1)requestAnimationFrame(step)});
}
function render(animate){
  var s=state,it=null,h;
  if(ui.view==='product'){it=s.items.filter(function(x){return x.id===ui.pid})[0];if(!it)ui.view='home'}
  h=sign(s,ui.view!=='home');
  if(canEdit){
    h+=tabsHtml();
    if(localDraft&&ui.view!=='edit')h+='<p class="note">Đang hiển thị bản nháp lưu trên máy này, khách quét mã chưa thấy. Vào Chỉnh sửa và bấm Lưu để đưa lên.</p>';
  }
  h+=ui.view==='edit'&&draft?viewEdit():ui.view==='labels'?viewLabels(s):ui.view==='product'?viewProduct(s,it):viewHome(s);
  app.className=animate&&!still?'anim':'';
  app.innerHTML=h;
  if(animate&&ui.view==='product')countUp();
}
function go(view,pid,fromEl){
  var prev=ui.view==='product'?ui.pid:'';
  var run=function(){
    ui.view=view;ui.pid=pid||'';ui.msg='';
    if(view==='edit'&&!draft)draft=JSON.parse(JSON.stringify(state));
    render(true);window.scrollTo(0,0);
    if(view==='home'&&prev){var c=app.querySelector('[data-go="'+prev+'"] .tile');if(c){c.style.viewTransitionName='ptile';c.scrollIntoView({block:'center'})}}
  };
  var clear=function(){[].forEach.call(app.querySelectorAll('.card .tile'),function(x){x.style.viewTransitionName=''})};
  if(document.startViewTransition&&!still){
    try{
      if(fromEl&&!prev){var tl=fromEl.querySelector('.tile');if(tl)tl.style.viewTransitionName='ptile'}
      var vt=document.startViewTransition(run);vt.finished.then(clear,clear);return;
    }catch(e){}
  }
  run();
}
function setPath(o,path,v){var k=path.split('.'),i=0;for(;i<k.length-1;i++)o=o[k[i]];o[k[i]]=v}
function say(m){ui.msg=m;var e=$('msg');if(e)e.textContent=m}
function buildDoc(s){
  var reset=(document.head.querySelector('style')||{}).textContent||'';
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>'+TITLE+'</title>\n'+FONT+'\n<style id="css">'+$('css').textContent+'</style>\n<div id="app"></div>\n'
    +'<script type="application/json" id="state">'+json+'<\/script>\n<script src="'+QRSRC+'"><\/script>\n<script id="code">'+$('code').textContent+'<\/script>\n</body></html>';
}
function save(){
  draft.items.forEach(function(it){it.price=Math.max(0,parseInt(it.price,10)||0);it.tone=+it.tone||1});
  draft.rate=Math.max(1,parseInt(draft.rate,10)||3600);
  var next=JSON.parse(JSON.stringify(draft));
  ls('draft2',JSON.stringify(next));
  if(!artifact){state=next;localDraft=true;say('Bản xem này không lưu chung được. Thay đổi đang giữ trên máy này.');return}
  next.rev=(state.rev||1)+1;
  say('Đang lưu…');
  artifact.publish(buildDoc(next)).then(function(){ls('draft2',null);say('Đã lưu. Trang đang tải lại.')},function(e){
    var c=e&&e.code;
    if(c==='conflict'){say('Có bản mới hơn vừa được lưu, trang đang tải lại.')}
    else if(c==='too_large'){say('Trang quá nặng. Bỏ bớt ảnh rồi lưu lại.')}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){state=next;state.rev=draft.rev;localDraft=true;say('Tài khoản này chỉ được xem. Thay đổi đang giữ trên máy này.')}
    else{say('Chưa lưu được. Bấm Lưu lại sau ít phút.')}
  });
}
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.74))};im.src=r.result};
  r.readAsDataURL(file);
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.lang){ui.lang=d.lang;ls('lang2',d.lang);render()}
  else if(d.go){go('product',d.go,b);try{history.replaceState(null,'','#'+d.go)}catch(x){}}
  else if(d.view){go(d.view);try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}}
  else if(d.copy){var done=function(){b.textContent=T.copied[ui.lang==='vi'?1:0]};try{navigator.clipboard.writeText(d.copy).then(done,function(){})}catch(x){}}
  else if(d.add){draft.seq=(draft.seq||draft.items.length)+1;var id='sp'+draft.seq;draft.items.push({id:id,cat:draft.cats[0].id,ch:'新',tone:1,zh:'',vi:'Sản phẩm mới',price:0,uzh:'',uvi:'',img:''});ui.edOpen=id;render()}
  else if(d.del){ if(d.sure){draft.items.splice(+d.del,1);render()}else{b.dataset.sure='1';b.textContent='Bấm lần nữa để xóa'} }
  else if(d.up){var i=+d.up,x=draft.items.splice(i,1)[0];draft.items.splice(i-1,0,x);ui.edOpen=x.id;render()}
  else if(d.noimg){draft.items[+d.noimg].img='';ui.edOpen=draft.items[+d.noimg].id;render()}
  else if(d.save){save()}
  else if(d.cancel){draft=null;ls('draft2',null);go('home')}
});
app.addEventListener('input',function(e){var p=e.target.dataset.p;if(p&&draft)setPath(draft,p,e.target.value)});
app.addEventListener('change',function(e){
  var i=e.target.dataset.img;if(i===undefined||!e.target.files[0])return;
  shrink(e.target.files[0],function(u){draft.items[+i].img=u;ui.edOpen=draft.items[+i].id;render()});
});
app.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.ed&&d.open)ui.edOpen=d.dataset.ed},true);
function fromHash(){
  var id=(location.hash||'').slice(1);
  if(id==='tem'){go('labels');return}
  if(id&&state.items.some(function(it){return it.id===id}))go('product',id);
}
window.addEventListener('hashchange',fromHash);
render(true);if(location.hash)fromHash();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    artifact=r[1];
    return r[0]?r[0].canEdit():false;
  }).then(function(ok){if(ok){canEdit=true;var sg=app.querySelector('.sign');if(sg&&!app.querySelector('.tabs'))sg.insertAdjacentHTML('afterend',tabsHtml())}},function(){});
}
})();
</script>

</body></html>
